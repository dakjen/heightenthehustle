<text x="114" y="262">Template</text><text x="302" y="262">AI</text><text x="490" y="262">You</text><text x="678" y="262">PDF</text>
</g>
<g font-size="16" fill="#171717" text-anchor="middle">
<text x="114" y="286">for the bones</text><text x="302" y="286">for the draft</text><text x="490" y="286">for the facts</text><text x="490" y="306">and the voice</text><text x="678" y="286">out the door</text>
</g>
<g font-size="14" fill="#4b4b4b" text-anchor="middle">
<text x="114" y="348">Open it and</text><text x="114" y="368">make your copy</text>
