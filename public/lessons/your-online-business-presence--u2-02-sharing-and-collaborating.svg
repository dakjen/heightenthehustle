<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Three permission levels as rising steps: Viewer looks, Commenter suggests, Editor changes, each with an example of who gets it</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#171717">Give the lowest permission that works</text>
<text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b">You can always raise it later</text>
<rect x="40" y="270" width="220" height="140" fill="#f6f6f6" stroke="#d4d4d4" stroke-width="2"/>
<rect x="290" y="200" width="220" height="210" fill="#f6f6f6" stroke="#d4d4d4" stroke-width="2"/>
<rect x="540" y="130" width="220" height="280" fill="#f6e9e9" stroke="#910000" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#171717">
<text x="58" y="304">Viewer</text><text x="308" y="234">Commenter</text><text x="558" y="164">Editor</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#910000">
<text x="58" y="328">Looks</text><text x="308" y="258">Suggests</text><text x="558" y="188">Changes</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717">
<text x="58" y="352">Look only</text><text x="308" y="282">Comment and suggest</text><text x="558" y="212">Change anything</text>
</g>
<g stroke="#d4d4d4"><line x1="58" y1="364" x2="242" y2="364"/><line x1="308" y1="294" x2="492" y2="294"/></g>
<line x1="558" y1="224" x2="742" y2="224" stroke="#910000" stroke-opacity="0.3"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b">
<text x="58" y="386">A price list for customers</text>
<text x="308" y="316">A client reviewing</text><text x="308" y="334">a proposal</text>
<text x="558" y="246">A business partner,</text><text x="558" y="264">your bookkeeper</text>
</g>
</svg>
