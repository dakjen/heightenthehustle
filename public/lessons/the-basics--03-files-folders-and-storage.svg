<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
  <title>The file name 2026-03 Invoice 004 - Johnson broken into its three parts: date, what it is, and who it is for</title>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="46" font-size="20" font-weight="bold" fill="#171717">Date, then what it is, then who it is for</text>

    <!-- the name in three parts -->
    <rect x="40" y="76" width="190" height="70" rx="8" fill="#f6e9e9" stroke="#910000" stroke-width="2"/>
    <text x="135" y="121" font-size="28" font-weight="bold" fill="#171717" text-anchor="middle">2026-03</text>

    <rect x="250" y="76" width="250" height="70" rx="8" fill="#f6f6f6" stroke="#d4d4d4" stroke-width="2"/>
    <text x="375" y="121" font-size="28" font-weight="bold" fill="#171717" text-anchor="middle">Invoice 004</text>

    <text x="525" y="121" font-size="28" font-weight="bold" fill="#171717" text-anchor="middle">-</text>

    <rect x="550" y="76" width="210" height="70" rx="8" fill="#f6f6f6" stroke="#d4d4d4" stroke-width="2"/>
    <text x="655" y="121" font-size="28" font-weight="bold" fill="#171717" text-anchor="middle">Johnson</text>

    <!-- labels -->
    <g stroke="#910000" stroke-width="2">
      <line x1="135" y1="150" x2="135" y2="168"/>
      <line x1="375" y1="150" x2="375" y2="168"/>
      <line x1="655" y1="150" x2="655" y2="168"/>
    </g>
    <text x="135" y="190" font-size="16" font-weight="bold" fill="#910000" text-anchor="middle">Date</text>
    <text x="135" y="212" font-size="14" fill="#4b4b4b" text-anchor="middle">year first, then month</text>
    <text x="375" y="190" font-size="16" font-weight="bold" fill="#910000" text-anchor="middle">What it is</text>
    <text x="655" y="190" font-size="16" font-weight="bold" fill="#910000" text-anchor="middle">Who it is for</text>

    <!-- sorted list -->
    <line x1="40" y1="246" x2="760" y2="246" stroke="#d4d4d4" stroke-width="2"/>
    <text x="40" y="282" font-size="16" font-weight="bold" fill="#171717">Sorted by name, files stay in time order</text>

    <rect x="40" y="300" width="720" height="110" rx="8" fill="#f6f6f6" stroke="#d4d4d4" stroke-width="2"/>
    <line x1="40" y1="355" x2="760" y2="355" stroke="#d4d4d4" stroke-width="2"/>

    <path d="M62,314 h14 l6,6 v22 h-20 z" fill="#ffffff" stroke="#4b4b4b" stroke-width="2"/>
    <text x="100" y="334" font-size="16" fill="#171717"><tspan font-weight="bold" fill="#910000">2026-01</tspan> Sample Invoice - Practice Customer</text>

    <path d="M62,369 h14 l6,6 v22 h-20 z" fill="#ffffff" stroke="#4b4b4b" stroke-width="2"/>
    <text x="100" y="389" font-size="16" fill="#171717"><tspan font-weight="bold" fill="#910000">2026-03</tspan> Invoice 004 - Johnson</text>
  </g>
</svg>
