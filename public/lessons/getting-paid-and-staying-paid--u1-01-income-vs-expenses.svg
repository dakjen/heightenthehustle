<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
  <title>Tasha's last 30 days: $3,800 income minus $1,450 expenses leaves $2,350 profit</title>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="46" font-size="20" font-weight="bold" fill="#171717">Tasha's last 30 days</text>

    <rect x="32" y="72" width="200" height="110" rx="8" fill="#f6f6f6" stroke="#d4d4d4"/>
    <text x="132" y="110" font-size="16" fill="#4b4b4b" text-anchor="middle">Income</text>
    <text x="132" y="154" font-size="32" font-weight="bold" fill="#171717" text-anchor="middle">$3,800</text>

    <text x="266" y="140" font-size="34" fill="#171717" text-anchor="middle">−</text>

    <rect x="300" y="72" width="200" height="110" rx="8" fill="#f6f6f6" stroke="#d4d4d4"/>
    <text x="400" y="110" font-size="16" fill="#4b4b4b" text-anchor="middle">Expenses</text>
    <text x="400" y="154" font-size="32" font-weight="bold" fill="#171717" text-anchor="middle">$1,450</text>

    <text x="534" y="140" font-size="34" fill="#171717" text-anchor="middle">=</text>

    <rect x="568" y="72" width="200" height="110" rx="8" fill="#f6e9e9" stroke="#910000" stroke-width="2"/>
    <text x="668" y="110" font-size="16" fill="#910000" text-anchor="middle">Profit</text>
    <text x="668" y="154" font-size="32" font-weight="bold" fill="#910000" text-anchor="middle">$2,350</text>

    <text x="32" y="240" font-size="16" font-weight="bold" fill="#171717">Where the $3,800 went</text>
    <rect x="32" y="256" width="281" height="56" fill="#f6f6f6" stroke="#d4d4d4"/>
    <rect x="313" y="256" width="455" height="56" fill="#f6e9e9" stroke="#910000"/>
    <text x="172" y="291" font-size="18" font-weight="bold" fill="#171717" text-anchor="middle">$1,450</text>
    <text x="540" y="291" font-size="18" font-weight="bold" fill="#910000" text-anchor="middle">$2,350</text>
    <text x="32" y="338" font-size="14" fill="#4b4b4b">What the business cost to run</text>
    <text x="313" y="338" font-size="14" fill="#910000">What she kept</text>

    <line x1="32" y1="372" x2="768" y2="372" stroke="#d4d4d4"/>
    <text x="32" y="404" font-size="14" fill="#4b4b4b">Helper pay, supplies and gas were $1,150 of the $1,450.</text>
  </g>
</svg>
