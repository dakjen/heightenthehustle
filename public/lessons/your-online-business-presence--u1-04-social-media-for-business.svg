<text x="85" y="192" text-anchor="middle">Before</text><text x="157" y="192" text-anchor="middle" fill="#910000">After</text>
<text x="52" y="262">A front door,</text><text x="52" y="282">painted deep blue</text>
<text x="238" y="262">Paint made for</text><text x="238" y="282">moisture</text>
<text x="424" y="262">Andre and his</text><text x="424" y="282">daughter</text>
<text x="610" y="262">Thank you,</text><text x="610" y="282">Ms. Patterson</text>
