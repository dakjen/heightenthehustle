<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A four-week posting plan with one post per week: finished job, tip, about you and review, then the rotation starts over</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="36" y="48" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#171717">One post a week, four kinds of post</text>
