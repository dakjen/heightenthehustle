<text x="52" y="100">WEEK 1</text><text x="238" y="100">WEEK 2</text><text x="424" y="100">WEEK 3</text><text x="610" y="100">WEEK 4</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#171717">
<text x="52" y="126">Finished job</text><text x="238" y="126">Tip</text><text x="424" y="126">About you</text><text x="610" y="126">Review</text>
</g>
