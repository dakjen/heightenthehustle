<g fill="#d4d4d4">
<rect x="250" y="160" width="114" height="7"/><rect x="250" y="174" width="90" height="7"/><rect x="250" y="188" width="104" height="7"/><rect x="250" y="202" width="60" height="7"/>
<rect x="622" y="176" width="114" height="7"/><rect x="622" y="190" width="100" height="7"/><rect x="622" y="204" width="70" height="7"/>
</g>
<g fill="#910000">
<rect x="622" y="156" width="10" height="10"/><rect x="636" y="156" width="10" height="10"/><rect x="650" y="156" width="10" height="10"/><rect x="664" y="156" width="10" height="10"/><rect x="678" y="156" width="10" height="10"/>
</g>
