<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<title>Business letter on letterhead with six numbered parts from letterhead at the top to closing at the bottom</title>
<rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
<rect x="40" y="20" width="380" height="460" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
<text x="230" y="58" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#910000" text-anchor="middle" font-weight="bold">Golden Spoon Catering</text>
<text x="230" y="80" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b" text-anchor="middle">410 Maple Street, 555-0142</text>
<line x1="64" y1="94" x2="396" y2="94" stroke="#910000" stroke-width="1.5"/>
<rect x="64" y="118" width="90" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="148" width="150" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="162" width="170" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="176" width="120" height="6" fill="#d4d4d4" rx="3"/>
<text x="64" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Dear Ms. Alvarez,</text>
<rect x="64" y="238" width="332" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="252" width="320" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="266" width="250" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="290" width="332" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="304" width="326" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="318" width="332" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="342" width="332" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="356" width="300" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="370" width="180" height="6" fill="#d4d4d4" rx="3"/>
<rect x="64" y="398" width="80" height="6" fill="#d4d4d4" rx="3"/>
<text x="64" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Denise Carter</text>
<rect x="64" y="446" width="110" height="6" fill="#d4d4d4" rx="3"/>
<line x1="420" y1="64" x2="440" y2="64" stroke="#910000" stroke-width="1.5"/>
<circle cx="452" cy="64" r="11" fill="#910000"/>
<text x="452" y="69" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="474" y="69" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Letterhead: business name</text>
<text x="474" y="87" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">and contact details</text>
<line x1="420" y1="121" x2="440" y2="121" stroke="#910000" stroke-width="1.5"/>
<circle cx="452" cy="121" r="11" fill="#910000"/>
<text x="452" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="474" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Date</text>
<line x1="420" y1="165" x2="440" y2="165" stroke="#910000" stroke-width="1.5"/>
<circle cx="452" cy="165" r="11" fill="#910000"/>
<text x="452" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="474" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Recipient's name and address</text>
<line x1="420" y1="211" x2="440" y2="211" stroke="#910000" stroke-width="1.5"/>
<circle cx="452" cy="211" r="11" fill="#910000"/>
<text x="452" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="474" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Greeting</text>
<line x1="420" y1="300" x2="440" y2="300" stroke="#910000" stroke-width="1.5"/>
<circle cx="452" cy="300" r="11" fill="#910000"/>
<text x="452" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="474" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Body: why you are writing,</text>
<text x="474" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">the details, what happens next</text>
<line x1="420" y1="424" x2="440" y2="424" stroke="#910000" stroke-width="1.5"/>
<circle cx="452" cy="424" r="11" fill="#910000"/>
<text x="452" y="429" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="474" y="429" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Closing, your name and title</text>
<line x1="408" y1="236" x2="408" y2="376" stroke="#910000" stroke-width="1.5"/>
<line x1="403" y1="236" x2="408" y2="236" stroke="#910000" stroke-width="1.5"/>
<line x1="403" y1="376" x2="408" y2="376" stroke="#910000" stroke-width="1.5"/>
<line x1="408" y1="300" x2="420" y2="300" stroke="#910000" stroke-width="1.5"/>
</svg>
