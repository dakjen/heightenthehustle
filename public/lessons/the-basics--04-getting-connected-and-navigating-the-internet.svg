<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
  <title>Two search results marked up: the top one carries a Sponsored label, and the one below has an address ending in .gov</title>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="44" font-size="20" font-weight="bold" fill="#171717">Read the result before you click</text>

    <!-- results panel -->
    <rect x="40" y="66" width="440" height="356" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <rect x="60" y="84" width="400" height="36" rx="18" fill="#f6f6f6" stroke="#d4d4d4" stroke-width="2"/>
    <text x="80" y="108" font-size="15" fill="#4b4b4b">business license</text>
    <circle cx="432" cy="100" r="6" fill="none" stroke="#4b4b4b" stroke-width="2"/>
    <line x1="436" y1="105" x2="442" y2="111" stroke="#4b4b4b" stroke-width="2"/>

    <!-- result 1: ad -->
    <rect x="60" y="142" width="92" height="26" rx="4" fill="#f6e9e9" stroke="#910000" stroke-width="2"/>
    <text x="106" y="160" font-size="14" font-weight="bold" fill="#910000" text-anchor="middle">Sponsored</text>
    <circle cx="176" cy="155" r="13" fill="#910000"/>
    <text x="176" y="160" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="60" y="182" width="280" height="12" fill="#171717"/>
    <rect x="60" y="206" width="190" height="8" fill="#4b4b4b"/>
    <rect x="60" y="228" width="380" height="8" fill="#d4d4d4"/>
    <rect x="60" y="244" width="300" height="8" fill="#d4d4d4"/>

    <line x1="60" y1="274" x2="460" y2="274" stroke="#d4d4d4" stroke-width="2"/>

    <!-- result 2: official -->
    <rect x="60" y="296" width="260" height="12" fill="#171717"/>
    <rect x="60" y="326" width="150" height="8" fill="#4b4b4b"/>
    <rect x="216" y="316" width="52" height="28" rx="4" fill="#f6e9e9" stroke="#910000" stroke-width="2"/>
    <text x="242" y="336" font-size="16" font-weight="bold" fill="#910000" text-anchor="middle">.gov</text>
    <circle cx="292" cy="330" r="13" fill="#910000"/>
    <text x="292" y="335" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="60" y="362" width="380" height="8" fill="#d4d4d4"/>
    <rect x="60" y="378" width="320" height="8" fill="#d4d4d4"/>

    <!-- callouts -->
    <circle cx="524" cy="90" r="13" fill="#910000"/>
    <text x="524" y="95" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="548" y="96" font-size="16" font-weight="bold" fill="#171717">Sponsored or Ad</text>
    <text x="548" y="120" font-size="14" fill="#4b4b4b">An ad, not always</text>
    <text x="548" y="140" font-size="14" fill="#4b4b4b">the official site</text>

    <circle cx="524" cy="190" r="13" fill="#910000"/>
    <text x="524" y="195" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="548" y="196" font-size="16" font-weight="bold" fill="#171717">The address</text>
    <text x="548" y="220" font-size="14" fill="#4b4b4b">Shown under the title.</text>
    <text x="548" y="240" font-size="14" fill="#4b4b4b">Government offices</text>
    <text x="548" y="260" font-size="14" fill="#4b4b4b">generally end in .gov</text>

    <rect x="510" y="312" width="250" height="110" rx="8" fill="#f6e9e9" stroke="#910000" stroke-width="2"/>
    <text x="528" y="344" font-size="16" font-weight="bold" fill="#910000">Charges a fee to file?</text>
    <text x="528" y="374" font-size="14" fill="#171717">Stop and check</text>
    <text x="528" y="396" font-size="14" fill="#171717">the address again</text>
  </g>
</svg>
