<text x="452" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b" text-anchor="start">each section label, all matching</text>
<line x1="384" y1="157" x2="440" y2="157" stroke="#910000" stroke-width="1.5"/>
