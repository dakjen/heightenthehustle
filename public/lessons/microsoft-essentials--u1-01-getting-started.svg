<text x="452" y="254" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#910000" text-anchor="start" font-weight="bold">Even spacing</text>
<text x="452" y="274" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b" text-anchor="start">line spacing 1.15, same space</text>
