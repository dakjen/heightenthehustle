<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img">
  <title>Sample invoice 1001 from Bright Path Cleaning to Oak Street Dental with the six elements numbered</title>
  <rect x="0" y="0" width="800" height="560" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717">
    <rect x="30" y="30" width="476" height="512" fill="#f6f6f6"/>
    <rect x="24" y="24" width="476" height="512" fill="#ffffff" stroke="#d4d4d4"/>

    <text x="64" y="62" font-size="18" font-weight="bold">Bright Path Cleaning LLC</text>
    <text x="64" y="84" fill="#4b4b4b">Tasha Reed, 555-0142</text>
    <text x="476" y="62" font-size="16" font-weight="bold" text-anchor="end">INVOICE</text>
    <text x="476" y="84" text-anchor="end">No. 1001</text>

    <text x="64" y="124" fill="#4b4b4b">Bill to</text>
    <text x="64" y="144" font-weight="bold">Oak Street Dental</text>
    <text x="64" y="164">Attention Office Manager</text>
    <text x="476" y="124" text-anchor="end" fill="#4b4b4b">Invoice date: March 31</text>
    <rect x="336" y="130" width="148" height="24" fill="#f6e9e9"/>
    <text x="476" y="147" text-anchor="end" font-weight="bold" fill="#910000">Due date: April 14</text>

    <rect x="56" y="186" width="428" height="28" fill="#f6f6f6"/>
    <g font-weight="bold">
      <text x="64" y="205">Description</text>
      <text x="340" y="205" text-anchor="end">Quantity</text>
      <text x="396" y="205" text-anchor="end">Price</text>
      <text x="476" y="205" text-anchor="end">Line total</text>
    </g>
    <text x="64" y="238">Weekly office cleaning, March</text>
    <text x="340" y="238" text-anchor="end">4 visits</text>
    <text x="396" y="238" text-anchor="end">$150</text>
    <text x="476" y="238" text-anchor="end">$600</text>
    <line x1="56" y1="250" x2="484" y2="250" stroke="#d4d4d4"/>
    <text x="64" y="272">Carpet shampoo, waiting room</text>
    <text x="340" y="272" text-anchor="end">1</text>
    <text x="396" y="272" text-anchor="end">$180</text>
    <text x="476" y="272" text-anchor="end">$180</text>
    <line x1="56" y1="284" x2="484" y2="284" stroke="#d4d4d4"/>
    <text x="64" y="306">Restroom supplies restock</text>
    <text x="340" y="306" text-anchor="end">1</text>
    <text x="396" y="306" text-anchor="end">$45</text>
    <text x="476" y="306" text-anchor="end">$45</text>
    <line x1="56" y1="318" x2="484" y2="318" stroke="#d4d4d4"/>

    <rect x="304" y="330" width="180" height="34" fill="#f6e9e9"/>
    <text x="316" y="353" font-size="16" font-weight="bold">Total due</text>
    <text x="476" y="353" font-size="16" font-weight="bold" text-anchor="end" fill="#910000">$825</text>

    <text x="64" y="402" font-weight="bold">How to pay</text>
    <text x="64" y="424">Zelle to 555-0142</text>
    <text x="64" y="444">Check payable to Bright Path Cleaning LLC</text>
    <text x="64" y="464">Card: use the link sent with this invoice</text>

    <text x="64" y="506" fill="#4b4b4b">Thank you for your business.</text>

    <g fill="#910000">
      <circle cx="44" cy="57" r="11"/>
      <circle cx="44" cy="139" r="11"/>
      <circle cx="398" cy="79" r="11"/>
      <circle cx="44" cy="200" r="11"/>
      <circle cx="286" cy="347" r="11"/>
      <circle cx="320" cy="142" r="11"/>
      <circle cx="44" cy="397" r="11"/>
    </g>
    <g fill="#ffffff" font-weight="bold" text-anchor="middle">
      <text x="44" y="62">1</text>
      <text x="44" y="144">1</text>
      <text x="398" y="84">2</text>
      <text x="44" y="205">3</text>
      <text x="286" y="352">4</text>
      <text x="320" y="147">5</text>
      <text x="44" y="402">6</text>
    </g>

    <text x="532" y="62" font-size="18" font-weight="bold">The six elements</text>
    <text x="532" y="86" font-size="18" font-weight="bold">that get you paid</text>

    <g fill="#910000">
      <circle cx="544" cy="135" r="11"/>
      <circle cx="544" cy="179" r="11"/>
      <circle cx="544" cy="223" r="11"/>
      <circle cx="544" cy="267" r="11"/>
      <circle cx="544" cy="311" r="11"/>
      <circle cx="544" cy="355" r="11"/>
    </g>
    <g fill="#ffffff" font-weight="bold" text-anchor="middle">
      <text x="544" y="140">1</text>
      <text x="544" y="184">2</text>
      <text x="544" y="228">3</text>
      <text x="544" y="272">4</text>
      <text x="544" y="316">5</text>
      <text x="544" y="360">6</text>
    </g>
    <g font-size="16">
      <text x="566" y="141">Both parties</text>
      <text x="566" y="185">Invoice number</text>
      <text x="566" y="229">Itemized work</text>
      <text x="566" y="273">The total</text>
      <text x="566" y="317">A real due date</text>
      <text x="566" y="361">Exactly how to pay</text>
    </g>

    <rect x="532" y="408" width="244" height="72" rx="8" fill="#f6f6f6" stroke="#d4d4d4"/>
    <text x="548" y="436" fill="#4b4b4b">Check the math</text>
    <text x="548" y="462" font-size="16" font-weight="bold">$600 + $180 + $45 = $825</text>
  </g>
</svg>
