<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Arial, Helvetica, sans-serif">
<title>One prompt split into its three parts: context, a specific task and a format</title>
<rect width="800" height="450" fill="#ffffff"/>
<g>
<rect x="32" y="30" width="736" height="110" rx="10" fill="#f6f6f6" stroke="#d4d4d4"/>
<rect x="32" y="170" width="736" height="110" rx="10" fill="#f6f6f6" stroke="#d4d4d4"/>
<rect x="32" y="310" width="736" height="110" rx="10" fill="#f6f6f6" stroke="#d4d4d4"/>
<rect x="340" y="46" width="412" height="78" rx="6" fill="#ffffff" stroke="#d4d4d4"/>
<rect x="340" y="186" width="412" height="78" rx="6" fill="#ffffff" stroke="#d4d4d4"/>
<rect x="340" y="326" width="412" height="78" rx="6" fill="#ffffff" stroke="#d4d4d4"/>
</g>
<g fill="#910000"><circle cx="66" cy="85" r="16"/><circle cx="66" cy="225" r="16"/><circle cx="66" cy="365" r="16"/></g>
<g font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle"><text x="66" y="91">1</text><text x="66" y="231">2</text><text x="66" y="371">3</text></g>
<g font-size="20" font-weight="bold" fill="#171717"><text x="96" y="80">Context</text><text x="96" y="220">A specific task</text><text x="96" y="360">A format</text></g>
<g font-size="14" fill="#4b4b4b">
<text x="96" y="104">Who you are and who this is for</text>
<text x="96" y="244">Exactly what you want made</text>
<text x="96" y="384">How long, how many versions,</text><text x="96" y="402">what style</text>
</g>
<g font-size="16" fill="#171717">
<text x="358" y="91">I run a cleaning business in Baltimore.</text>
<text x="358" y="220">Write a short, friendly text offering past</text>
<text x="358" y="242">clients 15% off a spring deep-clean.</text>
<text x="358" y="371">Under 50 words, three options.</text>
</g>
<g font-size="22" font-weight="bold" fill="#910000" text-anchor="middle"><text x="400" y="163">+</text><text x="400" y="303">+</text></g>
</svg>
