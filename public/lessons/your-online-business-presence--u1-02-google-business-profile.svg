<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>A business listing card with its parts numbered: name, category, hours and phone, photos, services and reviews with a reply</title>
<rect width="800" height="450" fill="#ffffff"/>
<rect x="40" y="30" width="400" height="390" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="60" y="68" font-size="20" font-weight="bold" fill="#171717">Fresh Line Barbershop</text>
<rect x="60" y="80" width="136" height="26" rx="13" fill="#f6e9e9"/>
<text x="128" y="98" font-size="14" fill="#910000" text-anchor="middle">Primary category</text>
<g font-size="14" fill="#4b4b4b">
<text x="60" y="140">Hours</text><text x="60" y="164">Phone</text><text x="60" y="188">Address or service area</text>
</g>
<rect x="60" y="298" width="96" height="28" rx="14" fill="#f6f6f6" stroke="#d4d4d4"/>
<text x="108" y="317" font-size="14" fill="#171717" text-anchor="middle">Kids' cuts</text>
</g>
<g stroke="#d4d4d4" stroke-width="1">
<line x1="60" y1="118" x2="420" y2="118"/><line x1="60" y1="204" x2="420" y2="204"/><line x1="60" y1="286" x2="420" y2="286"/><line x1="60" y1="338" x2="420" y2="338"/>
</g>
<g fill="#d4d4d4">
<rect x="240" y="131" width="150" height="8"/><rect x="240" y="155" width="110" height="8"/><rect x="240" y="179" width="170" height="8"/>
<rect x="60" y="354" width="300" height="7"/><rect x="60" y="366" width="220" height="7"/>
<rect x="96" y="388" width="260" height="7"/><rect x="96" y="400" width="180" height="7"/>
</g>
<g fill="#f6f6f6" stroke="#d4d4d4">
<rect x="60" y="216" width="112" height="58"/><rect x="184" y="216" width="112" height="58"/><rect x="308" y="216" width="112" height="58"/>
<rect x="166" y="298" width="96" height="28" rx="14"/><rect x="272" y="298" width="96" height="28" rx="14"/>
</g>
<g stroke="#d4d4d4" stroke-width="1" fill="none">
<path d="M60 274 L96 244 L124 262 L148 236 L172 258"/><path d="M184 274 L220 244 L248 262 L272 236 L296 258"/><path d="M308 274 L344 244 L372 262 L396 236 L420 258"/>
</g>
<line x1="84" y1="384" x2="84" y2="408" stroke="#910000" stroke-width="3"/>
<g stroke="#910000" stroke-width="1.5">
<line x1="290" y1="62" x2="478" y2="62"/><line x1="200" y1="93" x2="478" y2="93"/><line x1="416" y1="160" x2="478" y2="160"/><line x1="424" y1="245" x2="478" y2="245"/><line x1="372" y1="312" x2="478" y2="312"/><line x1="364" y1="380" x2="478" y2="380"/>
</g>
<g fill="#910000">
<circle cx="490" cy="62" r="12"/><circle cx="490" cy="93" r="12"/><circle cx="490" cy="160" r="12"/><circle cx="490" cy="245" r="12"/><circle cx="490" cy="312" r="12"/><circle cx="490" cy="380" r="12"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
<text x="490" y="67">1</text><text x="490" y="98">2</text><text x="490" y="165">3</text><text x="490" y="250">4</text><text x="490" y="317">5</text><text x="490" y="385">6</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#171717">
<text x="512" y="67">Name, as on your sign</text>
<text x="512" y="98">Most specific category</text>
<text x="512" y="158">Hours and phone</text>
<text x="512" y="250">Real work photos</text>
<text x="512" y="317">Services by name</text>
<text x="512" y="378">Reviews</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b">
<text x="512" y="178">Address or service area</text>
<text x="512" y="398">A reply to every one</text>
</g>
