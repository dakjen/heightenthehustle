<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Arial, Helvetica, sans-serif">
<title>A locked device in the centre with the four settings that protect it: automatic updates, screen lock, find my device and a tested backup</title>
