<circle cx="220" cy="310" r="12" fill="#d4d4d4"/>
<path d="M230 352 L300 312 L370 342 L370 352 Z" fill="#d4d4d4"/>
<text x="430" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b" text-anchor="start">410 Maple Street</text>
<text x="430" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b" text-anchor="start">555-0142</text>
<rect x="430" y="334" width="190" height="6" fill="#d4d4d4" rx="3"/>
<rect x="430" y="348" width="180" height="6" fill="#d4d4d4" rx="3"/>
<text x="400" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b" text-anchor="middle">Same title position, font and colors on every slide</text>
