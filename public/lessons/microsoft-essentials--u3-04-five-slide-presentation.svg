<text x="574" y="193" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717" text-anchor="start" font-weight="bold">Product or service</text>
<text x="560" y="66" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717" text-anchor="start" font-weight="bold">What We Offer</text>
<rect x="560" y="74" width="60" height="3" fill="#910000"/>
<rect x="154" y="234" width="232" height="130" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
<circle cx="166" cy="388" r="11" fill="#910000"/>
