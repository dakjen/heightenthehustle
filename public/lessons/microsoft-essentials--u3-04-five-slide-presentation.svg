<text x="184" y="393" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717" text-anchor="start" font-weight="bold">Supporting visual</text>
<text x="170" y="266" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717" text-anchor="start" font-weight="bold">Fresh Cuts Every Day</text>
<rect x="170" y="274" width="60" height="3" fill="#910000"/>
<rect x="414" y="234" width="232" height="130" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
<circle cx="426" cy="388" r="11" fill="#910000"/>
<text x="426" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="444" y="393" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717" text-anchor="start" font-weight="bold">Closing</text>
<text x="430" y="266" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717" text-anchor="start" font-weight="bold">Come See Us</text>
