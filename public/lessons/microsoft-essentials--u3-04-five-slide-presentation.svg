<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Five slide thumbnails for a business introduction, labelled title, overview, product or service, supporting visual and closing</title>
<rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
<rect x="24" y="34" width="232" height="130" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
<circle cx="36" cy="188" r="11" fill="#910000"/>
<text x="36" y="193" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="54" y="193" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717" text-anchor="start" font-weight="bold">Title</text>
<rect x="284" y="34" width="232" height="130" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
<circle cx="296" cy="188" r="11" fill="#910000"/>
<text x="296" y="193" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="314" y="193" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717" text-anchor="start" font-weight="bold">Overview</text>
<text x="300" y="66" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717" text-anchor="start" font-weight="bold">Who We Are</text>
<rect x="300" y="74" width="60" height="3" fill="#910000"/>
<rect x="544" y="34" width="232" height="130" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
<circle cx="556" cy="188" r="11" fill="#910000"/>
