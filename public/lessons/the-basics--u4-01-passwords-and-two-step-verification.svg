<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Arial, Helvetica, sans-serif">
<title>An example passphrase broken into its five unrelated words, with notes on what makes it strong</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="44" y="64" font-size="22" font-weight="bold" fill="#171717">A passphrase: four or five unrelated words</text>
<g fill="#f6f6f6" stroke="#d4d4d4">
<rect x="44" y="96" width="120" height="64" rx="8"/><rect x="192" y="96" width="120" height="64" rx="8"/><rect x="340" y="96" width="120" height="64" rx="8"/><rect x="488" y="96" width="120" height="64" rx="8"/><rect x="636" y="96" width="120" height="64" rx="8"/>
</g>
<g font-size="20" font-weight="bold" fill="#171717" text-anchor="middle">
<text x="104" y="135">copper</text><text x="252" y="135">lantern</text><text x="400" y="135">seventeen</text><text x="548" y="135">walrus</text><text x="696" y="135">picnic</text>
</g>
<g stroke="#910000" stroke-width="3"><path d="M172 128 h12 M320 128 h12 M468 128 h12 M616 128 h12"/></g>
<path d="M44 180 v10 h712 v-10" fill="none" stroke="#4b4b4b" stroke-width="2"/>
<text x="400" y="216" font-size="16" fill="#171717" text-anchor="middle">Long, and used for one account only</text>
<rect x="44" y="244" width="712" height="118" rx="10" fill="#f6f6f6" stroke="#d4d4d4"/>
<g fill="#910000"><circle cx="70" cy="275" r="5"/><circle cx="70" cy="307" r="5"/><circle cx="70" cy="339" r="5"/></g>
<g font-size="16" fill="#171717">
<text x="88" y="280">Words that have nothing to do with each other or with you</text>
<text x="88" y="312">No names, birthdays, your street, famous quotes or song lines</text>
<text x="88" y="344">A number or symbol between words if a site requires one</text>
</g>
<rect x="44" y="380" width="712" height="42" rx="8" fill="#f6e9e9" stroke="#910000"/>
<text x="400" y="407" font-size="16" font-weight="bold" fill="#910000" text-anchor="middle">For illustration only. Never use a lesson example as a real password.</text>
</svg>
