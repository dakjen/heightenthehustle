<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
  <title>Dee's four products and services pointed at two income accounts: Catering Income $3,400 and Meal Prep Income $1,800, total $5,200</title>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717">
    <text x="32" y="42" font-size="20" font-weight="bold">One income account per line of business</text>
    <text x="32" y="76" fill="#4b4b4b">What Dee sells</text>
    <text x="470" y="76" fill="#4b4b4b">Income account</text>

    <rect x="32" y="88" width="298" height="44" rx="6" fill="#f6f6f6" stroke="#d4d4d4"/>
    <rect x="32" y="144" width="298" height="44" rx="6" fill="#f6f6f6" stroke="#d4d4d4"/>
    <rect x="32" y="200" width="298" height="44" rx="6" fill="#f6f6f6" stroke="#d4d4d4"/>
    <rect x="32" y="288" width="298" height="44" rx="6" fill="#f6f6f6" stroke="#d4d4d4"/>

    <text x="48" y="115">Catered lunch, per person</text>
    <text x="314" y="115" text-anchor="end" font-weight="bold">$18</text>
    <text x="48" y="171">Dessert tray</text>
    <text x="314" y="171" text-anchor="end" font-weight="bold">$65</text>
    <text x="48" y="227">Delivery and setup</text>
    <text x="314" y="227" text-anchor="end" font-weight="bold">$40</text>
    <text x="48" y="315">Weekly meal-prep box</text>
    <text x="314" y="315" text-anchor="end" font-weight="bold">$90</text>

    <g stroke="#910000" stroke-width="2" fill="none">
      <line x1="330" y1="110" x2="454" y2="162"/>
      <line x1="330" y1="166" x2="454" y2="166"/>
      <line x1="330" y1="222" x2="454" y2="170"/>
      <line x1="330" y1="310" x2="454" y2="310"/>
    </g>
    <polygon points="468,166 454,158 454,174" fill="#910000"/>
    <polygon points="468,310 454,302 454,318" fill="#910000"/>

    <rect x="470" y="122" width="298" height="88" rx="8" fill="#f6e9e9" stroke="#910000" stroke-width="2"/>
    <text x="490" y="158" font-size="16" font-weight="bold">Catering Income</text>
    <text x="490" y="190" font-size="22" font-weight="bold" fill="#910000">$3,400</text>

    <rect x="470" y="266" width="298" height="88" rx="8" fill="#f6e9e9" stroke="#910000" stroke-width="2"/>
    <text x="490" y="302" font-size="16" font-weight="bold">Meal Prep Income</text>
    <text x="490" y="334" font-size="22" font-weight="bold" fill="#910000">$1,800</text>

    <line x1="32" y1="380" x2="768" y2="380" stroke="#d4d4d4"/>
    <text x="32" y="412" fill="#4b4b4b">$3,400 + $1,800 = $5,200</text>
    <text x="490" y="412" font-size="16" font-weight="bold">Total income</text>
    <text x="748" y="412" font-size="18" font-weight="bold" text-anchor="end">$5,200</text>
  </g>
</svg>
