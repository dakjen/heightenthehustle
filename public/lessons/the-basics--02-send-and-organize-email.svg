<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
  <title>The cleaning quote email to Ms. Reed with its three parts numbered: a subject line that says what it is about, the point in the opening two lines, and a clear next step at the end</title>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- email card -->
    <rect x="30" y="30" width="460" height="390" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>

    <rect x="42" y="44" width="436" height="38" rx="4" fill="#f6e9e9"/>
    <text x="52" y="68" font-size="14" fill="#4b4b4b">Subject: <tspan font-weight="bold" fill="#171717">Cleaning quote for your Charles St office</tspan></text>
    <line x1="30" y1="96" x2="490" y2="96" stroke="#d4d4d4" stroke-width="2"/>

    <text x="52" y="128" font-size="15" fill="#171717">Hi Ms. Reed,</text>

    <rect x="42" y="144" width="436" height="64" rx="4" fill="#f6e9e9"/>
    <text x="52" y="170" font-size="15" fill="#171717">I can clean your Charles St office twice a week</text>
    <text x="52" y="194" font-size="15" fill="#171717">for $240 a month.</text>

    <rect x="52" y="230" width="380" height="8" fill="#d4d4d4"/>
    <rect x="52" y="248" width="300" height="8" fill="#d4d4d4"/>

    <rect x="42" y="276" width="436" height="64" rx="4" fill="#f6e9e9"/>
    <text x="52" y="302" font-size="15" fill="#171717">If that price works, reply with a start date</text>
    <text x="52" y="326" font-size="15" fill="#171717">and I will send a short agreement to sign.</text>

    <rect x="52" y="364" width="110" height="8" fill="#4b4b4b"/>
    <rect x="52" y="380" width="150" height="8" fill="#d4d4d4"/>
    <rect x="52" y="396" width="110" height="8" fill="#d4d4d4"/>

    <!-- leader lines -->
    <g stroke="#910000" stroke-width="1.5">
      <line x1="478" y1="63" x2="516" y2="63"/>
      <line x1="478" y1="176" x2="516" y2="176"/>
      <line x1="478" y1="308" x2="516" y2="308"/>
    </g>

    <!-- callouts -->
    <circle cx="532" cy="63" r="15" fill="#910000"/>
    <text x="532" y="69" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="558" y="60" font-size="16" font-weight="bold" fill="#171717">A subject line that</text>
    <text x="558" y="82" font-size="16" font-weight="bold" fill="#171717">says what it's about</text>

    <circle cx="532" cy="176" r="15" fill="#910000"/>
    <text x="532" y="182" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="558" y="173" font-size="16" font-weight="bold" fill="#171717">The point in the</text>
    <text x="558" y="195" font-size="16" font-weight="bold" fill="#171717">opening two lines</text>

    <text x="516" y="248" font-size="14" fill="#4b4b4b">Background comes after</text>

    <circle cx="532" cy="308" r="15" fill="#910000"/>
    <text x="532" y="314" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="558" y="305" font-size="16" font-weight="bold" fill="#171717">A clear next step</text>
    <text x="558" y="327" font-size="16" font-weight="bold" fill="#171717">at the end</text>
  </g>
</svg>
