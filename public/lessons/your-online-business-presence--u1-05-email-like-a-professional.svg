<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>An email with four parts numbered: a business address, the point in the subject line, the ask in the opening two lines and a four-line signature</title>
<rect width="800" height="450" fill="#ffffff"/>
<rect x="40" y="40" width="430" height="350" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
<rect x="48" y="152" width="300" height="48" fill="#f6e9e9"/>
<rect x="48" y="264" width="230" height="92" fill="#f6f6f6"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b">
<text x="56" y="72">From</text><text x="56" y="110">Subject</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717">
<text x="124" y="72">tanyastablecatering@</text>
<text x="124" y="110" font-weight="bold">Need final headcount by Friday</text>
<text x="124" y="128" font-weight="bold">for March 14 lunch</text>
<text x="56" y="172">Hi Mr. Ellis, can you send me the final</text>
<text x="56" y="192">headcount by Friday at noon?</text>
<text x="60" y="286" font-weight="bold">Tanya Brooks</text>
<text x="60" y="306">Tanya's Table Catering</text>
<text x="60" y="326">(555) 010-0142</text>
<text x="60" y="346" fill="#910000">[your home base link]</text>
</g>
<g stroke="#d4d4d4"><line x1="56" y1="86" x2="454" y2="86"/><line x1="56" y1="142" x2="454" y2="142"/></g>
<g fill="#d4d4d4"><rect x="56" y="214" width="340" height="7"/><rect x="56" y="228" width="250" height="7"/></g>
<g stroke="#910000" stroke-width="1.5">
<line x1="270" y1="67" x2="498" y2="67"/><line x1="340" y1="114" x2="498" y2="114"/><line x1="352" y1="176" x2="498" y2="176"/><line x1="282" y1="310" x2="498" y2="310"/>
</g>
<g fill="#910000"><circle cx="510" cy="67" r="12"/><circle cx="510" cy="114" r="12"/><circle cx="510" cy="176" r="12"/><circle cx="510" cy="310" r="12"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
<text x="510" y="72">1</text><text x="510" y="119">2</text><text x="510" y="181">3</text><text x="510" y="315">4</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#171717">
<text x="532" y="72">A business address</text>
<text x="532" y="110">The point in the</text><text x="532" y="130">subject line</text>
<text x="532" y="172">The ask in the</text><text x="532" y="192">opening two lines</text>
<text x="532" y="306">Four-line signature</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4b4b4b">
<text x="532" y="326">Name, business, phone,</text><text x="532" y="344">one link</text>
</g>
</svg>
