<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
  <title>A customer's address moving from an email into an invoice in four moves: select, copy, switch apps, paste</title>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="44" font-size="20" font-weight="bold" fill="#171717">From an email into an invoice in four moves</text>

    <!-- email card -->
    <rect x="36" y="66" width="254" height="224" rx="8" fill="#f6f6f6" stroke="#d4d4d4" stroke-width="2"/>
    <text x="56" y="96" font-size="16" font-weight="bold" fill="#171717">Email</text>
    <line x1="36" y1="110" x2="290" y2="110" stroke="#d4d4d4" stroke-width="2"/>
    <rect x="56" y="128" width="180" height="8" fill="#d4d4d4"/>
    <rect x="56" y="146" width="140" height="8" fill="#d4d4d4"/>
    <rect x="52" y="168" width="222" height="34" fill="#f6e9e9" stroke="#910000" stroke-width="2"/>
    <text x="64" y="190" font-size="15" fill="#171717">customer's address</text>
    <rect x="56" y="220" width="190" height="8" fill="#d4d4d4"/>
    <rect x="56" y="238" width="120" height="8" fill="#d4d4d4"/>
    <rect x="56" y="256" width="160" height="8" fill="#d4d4d4"/>

    <!-- arrow -->
    <text x="400" y="170" font-size="15" font-weight="bold" fill="#910000" text-anchor="middle">No retyping</text>
    <line x1="304" y1="185" x2="484" y2="185" stroke="#910000" stroke-width="2"/>
    <polygon points="496,185 482,178 482,192" fill="#910000"/>

    <!-- invoice card -->
    <rect x="510" y="66" width="254" height="224" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
    <text x="530" y="96" font-size="16" font-weight="bold" fill="#171717">Invoice</text>
    <line x1="510" y1="110" x2="764" y2="110" stroke="#d4d4d4" stroke-width="2"/>
    <text x="530" y="136" font-size="14" fill="#4b4b4b">Address</text>
    <rect x="526" y="146" width="222" height="34" fill="#f6e9e9" stroke="#910000" stroke-width="2"/>
    <text x="538" y="168" font-size="15" fill="#171717">customer's address</text>
    <line x1="530" y1="200" x2="744" y2="200" stroke="#d4d4d4" stroke-width="1"/>
    <rect x="530" y="214" width="120" height="8" fill="#d4d4d4"/>
    <rect x="704" y="214" width="40" height="8" fill="#d4d4d4"/>
    <rect x="530" y="236" width="90" height="8" fill="#d4d4d4"/>
    <rect x="704" y="236" width="40" height="8" fill="#d4d4d4"/>
    <line x1="530" y1="256" x2="744" y2="256" stroke="#d4d4d4" stroke-width="1"/>
    <rect x="694" y="266" width="50" height="8" fill="#4b4b4b"/>

    <!-- steps -->
    <g>
      <rect x="36" y="318" width="170" height="106" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
      <circle cx="62" cy="346" r="14" fill="#910000"/>
      <text x="62" y="352" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
      <text x="86" y="352" font-size="16" font-weight="bold" fill="#171717">Select</text>
      <text x="52" y="384" font-size="14" fill="#4b4b4b">the address</text>
      <text x="52" y="404" font-size="14" fill="#4b4b4b">in the email</text>

      <rect x="222" y="318" width="170" height="106" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
      <circle cx="248" cy="346" r="14" fill="#910000"/>
      <text x="248" y="352" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <text x="272" y="352" font-size="16" font-weight="bold" fill="#171717">Copy</text>
      <text x="238" y="384" font-size="14" fill="#4b4b4b">Ctrl + C</text>
      <text x="238" y="404" font-size="14" fill="#4b4b4b">Mac: Command + C</text>

      <rect x="408" y="318" width="170" height="106" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
      <circle cx="434" cy="346" r="14" fill="#910000"/>
      <text x="434" y="352" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
      <text x="458" y="352" font-size="16" font-weight="bold" fill="#171717">Switch apps</text>
      <text x="424" y="384" font-size="14" fill="#4b4b4b">Alt + Tab</text>
      <text x="424" y="404" font-size="14" fill="#4b4b4b">Mac: Command + Tab</text>

      <rect x="594" y="318" width="170" height="106" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
      <circle cx="620" cy="346" r="14" fill="#910000"/>
      <text x="620" y="352" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
      <text x="644" y="352" font-size="16" font-weight="bold" fill="#171717">Paste</text>
      <text x="610" y="384" font-size="14" fill="#4b4b4b">Ctrl + V</text>
      <text x="610" y="404" font-size="14" fill="#4b4b4b">Mac: Command + V</text>
    </g>
  </g>
</svg>
