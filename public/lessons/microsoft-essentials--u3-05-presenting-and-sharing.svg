<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Presenter View: the audience screen shows only the slide, while the laptop shows the current slide, the next slide and the presenter notes</title>
<rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
<text x="24" y="44" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171717" text-anchor="start" font-weight="bold">The audience sees</text>
<rect x="24" y="60" width="330" height="190" fill="#ffffff" stroke="#171717" stroke-width="3"/>
<text x="52" y="104" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#171717" text-anchor="start" font-weight="bold">What We Offer</text>
<rect x="52" y="114" width="70" height="3" fill="#910000"/>
<rect x="52" y="140" width="190" height="7" fill="#d4d4d4" rx="3"/>
<rect x="52" y="164" width="220" height="7" fill="#d4d4d4" rx="3"/>
<rect x="52" y="188" width="230" height="7" fill="#d4d4d4" rx="3"/>
<rect x="52" y="212" width="170" height="7" fill="#d4d4d4" rx="3"/>
<text x="24" y="280" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#910000" text-anchor="start" font-weight="bold">Only the slide</text>
<text x="400" y="44" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#171717" text-anchor="start" font-weight="bold">Your laptop shows</text>
<rect x="400" y="60" width="376" height="336" fill="#ffffff" stroke="#171717" stroke-width="3"/>
<rect x="416" y="76" width="200" height="112" fill="#ffffff" stroke="#4b4b4b" stroke-width="1.5"/>
<text x="430" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start" font-weight="bold">What We Offer</text>
<rect x="430" y="118" width="110" height="5" fill="#d4d4d4" rx="3"/>
<rect x="430" y="133" width="130" height="5" fill="#d4d4d4" rx="3"/>
<rect x="430" y="148" width="136" height="5" fill="#d4d4d4" rx="3"/>
<rect x="430" y="163" width="100" height="5" fill="#d4d4d4" rx="3"/>
<text x="416" y="208" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#910000" text-anchor="start" font-weight="bold">Current slide</text>
<rect x="636" y="76" width="124" height="70" fill="#ffffff" stroke="#4b4b4b" stroke-width="1.5"/>
<rect x="648" y="92" width="70" height="5" fill="#d4d4d4" rx="3"/>
<rect x="648" y="106" width="90" height="5" fill="#d4d4d4" rx="3"/>
<rect x="648" y="120" width="80" height="5" fill="#d4d4d4" rx="3"/>
<text x="636" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#910000" text-anchor="start" font-weight="bold">Next slide</text>
<rect x="416" y="224" width="344" height="156" fill="#f6f6f6" stroke="#d4d4d4" stroke-width="1" rx="6"/>
<text x="432" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#910000" text-anchor="start" font-weight="bold">Your notes</text>
<text x="432" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Mention the kids’ Saturday special.</text>
<text x="432" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Walk-ins welcome before noon.</text>
<text x="432" y="332" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#171717" text-anchor="start">Products are by the register.</text>
</svg>
