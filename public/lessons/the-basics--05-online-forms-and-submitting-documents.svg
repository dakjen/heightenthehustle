<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img">
  <title>A generic application form with each field type labelled: text box, dropdown menu, radio buttons, checkboxes, date picker, upload button and the final Submit button</title>
  <rect x="0" y="0" width="800" height="520" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="42" font-size="20" font-weight="bold" fill="#171717">The field types on every application</text>

    <rect x="40" y="62" width="400" height="442" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>

    <!-- text box -->
    <text x="60" y="94" font-size="14" fill="#4b4b4b">Legal business name <tspan fill="#910000" font-weight="bold">*</tspan></text>
    <rect x="60" y="102" width="360" height="30" rx="4" fill="#f6f6f6" stroke="#4b4b4b" stroke-width="1.5"/>

    <!-- dropdown -->
    <text x="60" y="160" font-size="14" fill="#4b4b4b">State</text>
    <rect x="60" y="168" width="200" height="30" rx="4" fill="#f6f6f6" stroke="#4b4b4b" stroke-width="1.5"/>
    <polygon points="234,179 248,179 241,189" fill="#171717"/>

    <!-- radio -->
    <circle cx="70" cy="234" r="8" fill="#ffffff" stroke="#4b4b4b" stroke-width="1.5"/>
    <circle cx="70" cy="234" r="4" fill="#171717"/>
    <text x="86" y="239" font-size="14" fill="#171717">Yes</text>
    <circle cx="140" cy="234" r="8" fill="#ffffff" stroke="#4b4b4b" stroke-width="1.5"/>
    <text x="156" y="239" font-size="14" fill="#171717">No</text>

    <!-- checkboxes -->
    <rect x="62" y="268" width="16" height="16" fill="#ffffff" stroke="#4b4b4b" stroke-width="1.5"/>
    <path d="M65,276 l4,4 l7,-9" fill="none" stroke="#171717" stroke-width="2"/>
    <rect x="88" y="272" width="70" height="8" fill="#d4d4d4"/>
    <rect x="178" y="268" width="16" height="16" fill="#ffffff" stroke="#4b4b4b" stroke-width="1.5"/>
    <rect x="204" y="272" width="70" height="8" fill="#d4d4d4"/>
    <rect x="294" y="268" width="16" height="16" fill="#ffffff" stroke="#4b4b4b" stroke-width="1.5"/>
    <path d="M297,276 l4,4 l7,-9" fill="none" stroke="#171717" stroke-width="2"/>
    <rect x="320" y="272" width="70" height="8" fill="#d4d4d4"/>

    <!-- date picker -->
    <text x="60" y="320" font-size="14" fill="#4b4b4b">Start date</text>
    <rect x="60" y="328" width="200" height="30" rx="4" fill="#f6f6f6" stroke="#4b4b4b" stroke-width="1.5"/>
    <rect x="232" y="335" width="18" height="16" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
    <line x1="232" y1="340" x2="250" y2="340" stroke="#171717" stroke-width="1.5"/>

    <!-- upload -->
    <rect x="60" y="382" width="116" height="32" rx="4" fill="#f6f6f6" stroke="#171717" stroke-width="1.5"/>
    <text x="118" y="403" font-size="14" fill="#171717" text-anchor="middle">Choose file</text>
    <rect x="188" y="384" width="192" height="28" rx="4" fill="#f6e9e9"/>
    <rect x="198" y="394" width="130" height="8" fill="#4b4b4b"/>
    <text x="334" y="403" font-size="14" fill="#171717">.pdf</text>

    <!-- submit -->
    <line x1="60" y1="436" x2="420" y2="436" stroke="#d4d4d4" stroke-width="2"/>
    <rect x="60" y="452" width="116" height="36" rx="4" fill="#910000"/>
    <text x="118" y="475" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Submit</text>

    <!-- leader lines -->
    <g stroke="#910000" stroke-width="1.5">
      <line x1="424" y1="117" x2="488" y2="117"/>
      <line x1="264" y1="183" x2="488" y2="183"/>
      <line x1="184" y1="234" x2="488" y2="234"/>
      <line x1="396" y1="276" x2="488" y2="276"/>
      <line x1="264" y1="343" x2="488" y2="343"/>
      <line x1="384" y1="398" x2="488" y2="398"/>
      <line x1="180" y1="470" x2="488" y2="470"/>
    </g>

    <!-- labels -->
    <g font-size="16" font-weight="bold" fill="#910000">
      <text x="498" y="122">Text box</text>
      <text x="498" y="188">Dropdown menu</text>
      <text x="498" y="232">Radio buttons</text>
      <text x="498" y="274">Checkboxes</text>
      <text x="498" y="348">Date picker</text>
      <text x="498" y="396">Upload button</text>
      <text x="498" y="468">Final button</text>
    </g>
    <g font-size="14" fill="#4b4b4b">
      <text x="498" y="251">pick only one</text>
      <text x="498" y="293">as many as apply</text>
      <text x="498" y="415">file name appears when attached</text>
      <text x="498" y="487">nothing is sent until you click it</text>
    </g>
  </g>
</svg>
